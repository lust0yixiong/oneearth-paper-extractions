<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文原文 PDF</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#30353b;color:#23384b;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    header{height:54px;background:#f7fafc;border-bottom:1px solid #cfdae3;display:flex;align-items:center;gap:10px;padding:7px 14px;position:sticky;top:0;z-index:2}
    .name{font-weight:700;color:#174864;margin-right:auto;white-space:nowrap}.controls{display:flex;align-items:center;gap:7px;white-space:nowrap}
    button,.download{border:1px solid #b9cbd8;background:white;border-radius:7px;padding:6px 10px;color:#245d7d;font:inherit;cursor:pointer;text-decoration:none}
    button:hover,.download:hover{background:#e7f3fa}button:disabled{opacity:.45;cursor:default}input{width:48px;border:1px solid #b9cbd8;border-radius:6px;padding:5px;text-align:center;font:inherit}
    .status{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);background:#f7fafc;padding:14px 20px;border-radius:9px;color:#35556b;text-align:center;max-width:90vw;z-index:1}
    .status[hidden]{display:none}.stage{min-height:calc(100vh - 54px);overflow:auto;padding:22px 14px 40px;text-align:center}.stage canvas{display:block;margin:0 auto;background:white;box-shadow:0 4px 24px #0008;max-width:none}
    @media(max-width:720px){header{height:auto;min-height:54px;flex-wrap:wrap;justify-content:center;padding:8px}.name{display:none}.controls{gap:4px}.controls button,.download{padding:5px 7px}.stage{min-height:calc(100vh - 80px);padding:12px 5px 25px}}
  </style>
</head>
<body>
  <header>
    <span class="name">英文原文 PDF</span>
    <div class="controls" aria-label="PDF 页码控制">
      <button id="prev" type="button" aria-label="上一页">‹ 上页</button>
      <label><input id="page" type="number" min="1" value="1" aria-label="页码"> / <span id="total">…</span></label>
      <button id="next" type="button" aria-label="下一页">下页 ›</button>
      <button id="smaller" type="button" aria-label="缩小">−</button>
      <button id="fit" type="button">适合宽度</button>
      <button id="larger" type="button" aria-label="放大">＋</button>
      <a id="download" class="download" download>下载 PDF</a>
    </div>
  </header>
  <div id="status" class="status" role="status">正在加载英文原文…</div>
  <main class="stage" id="stage"><canvas id="paper" aria-label="PDF 页面"></canvas></main>
  <script type="module">
    import * as pdfjs from './vendor/pdfjs/pdf.mjs';
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdfjs/pdf.worker.mjs', import.meta.url).href;

    const file = new URLSearchParams(location.search).get('file') || '';
    const permitted = /^(?:acp-21-10413-2021\.pdf|paper_pdfs\/(?:\d+|[a-f0-9]{10})\.pdf)$/;
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('paper');
    const status = document.getElementById('status');
    const pageInput = document.getElementById('page');
    let documentPdf, currentPage = 1, zoom = 1, fitWidth = true, renderTask, generation = 0;

    function requestedPage() {
      const n = Number(new URLSearchParams(location.hash.slice(1)).get('page'));
      return Number.isInteger(n) && n > 0 ? n : 1;
    }
    function setStatus(message) { status.textContent = message; status.hidden = false; }
    function updateControls() {
      pageInput.value = currentPage;
      document.getElementById('prev').disabled = currentPage <= 1;
      document.getElementById('next').disabled = currentPage >= documentPdf.numPages;
    }
    async function showPage(number, updateHash = true) {
      if (!documentPdf) return;
      const selected = Math.min(documentPdf.numPages, Math.max(1, Number(number) || 1));
      currentPage = selected;
      updateControls();
      if (updateHash) history.replaceState(null, '', `#page=${selected}`);
      const thisGeneration = ++generation;
      if (renderTask) renderTask.cancel();
      setStatus(`正在显示第 ${selected} 页…`);
      try {
        const page = await documentPdf.getPage(selected);
        if (thisGeneration !== generation) return;
        const width = page.getViewport({scale:1}).width;
        const scale = fitWidth ? Math.max(.2, (stage.clientWidth - 28) / width) : zoom;
        const viewport = page.getViewport({scale});
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.ceil(viewport.width * ratio);
        canvas.height = Math.ceil(viewport.height * ratio);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;
        renderTask = page.render({canvasContext:canvas.getContext('2d'),viewport,transform:[ratio,0,0,ratio,0,0]});
        await renderTask.promise;
        if (thisGeneration === generation) {status.hidden = true;stage.scrollTop = 0;}
      } catch (error) {
        if (error?.name === 'RenderingCancelledException') return;
        if (thisGeneration === generation) setStatus(`PDF 显示失败：${error.message || error}`);
      }
    }
    document.getElementById('prev').addEventListener('click', () => showPage(currentPage - 1));
    document.getElementById('next').addEventListener('click', () => showPage(currentPage + 1));
    pageInput.addEventListener('change', () => showPage(pageInput.value));
    document.getElementById('smaller').addEventListener('click', () => {fitWidth=false;zoom=Math.max(.4,zoom/1.2);showPage(currentPage,false)});
    document.getElementById('larger').addEventListener('click', () => {fitWidth=false;zoom=Math.min(4,zoom*1.2);showPage(currentPage,false)});
    document.getElementById('fit').addEventListener('click', () => {fitWidth=true;showPage(currentPage,false)});
    window.addEventListener('hashchange', () => showPage(requestedPage(),false));
    window.addEventListener('resize', () => {if(fitWidth && documentPdf) showPage(currentPage,false)});

    if (!permitted.test(file)) {
      setStatus('未找到有效的论文 PDF。');
    } else {
      document.getElementById('download').href = file;
      try {
        documentPdf = await pdfjs.getDocument({url:file}).promise;
        document.getElementById('total').textContent = documentPdf.numPages;
        pageInput.max = documentPdf.numPages;
        showPage(requestedPage(),false);
      } catch (error) {
        setStatus(`PDF 加载失败：${error.message || error}`);
      }
    }
  </script>
</body>
</html>
