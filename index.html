<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文抽取结果 · 11 篇论文</title>
<style>
:root{--navy:#173b58;--blue:#176b9b;--paper:#f4f8fb;--line:#dae6ee;--muted:#6b8192}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--paper);color:#172e42;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.topbar{height:66px;display:flex;align-items:center;gap:14px;padding:0 17px;background:linear-gradient(100deg,#103b5d,#176b8b);color:white;position:relative;z-index:20;box-shadow:0 2px 12px #12375030}.menu{border:1px solid #a7c9da;background:#ffffff18;color:white;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:20px}.brand{font-size:18px;font-weight:760;white-space:nowrap}.top-title{font-size:13px;color:#e6f3f9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:600px}.import-link{margin-left:auto;border:1px solid #b8d9e8;border-radius:8px;padding:7px 12px;color:#fff;text-decoration:none;white-space:nowrap;font-weight:700}.import-link:hover{background:#ffffff22}.tabs{display:flex;gap:5px;flex-shrink:0}.tabs button{border:1px solid #87b9d1;background:transparent;color:white;border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit;white-space:nowrap}.tabs button.active{background:#fff;color:#135a7c;border-color:#fff;font-weight:700}.tabs button:hover:not(.active){background:#ffffff22}.tabs button:disabled{opacity:.42;cursor:not-allowed}
.drawer{position:fixed;left:0;top:66px;bottom:0;width:328px;background:#fff;border-right:1px solid var(--line);z-index:15;display:flex;flex-direction:column;transition:transform .23s ease;box-shadow:5px 0 20px #1237500b}.drawer-head{padding:18px 17px 11px;border-bottom:1px solid var(--line)}.drawer-head strong{display:block;font-size:16px}.drawer-head span{font-size:12px;color:var(--muted)}.drawer-search{width:100%;border:1px solid #c5d9e6;border-radius:8px;padding:9px 11px;margin-top:12px;font:inherit;outline-color:#7cbce0}.paper-list{overflow-y:auto;padding:10px}.paper-item{display:block;width:100%;border:1px solid transparent;background:transparent;border-radius:11px;text-align:left;padding:11px 12px;margin:2px 0;cursor:pointer;color:inherit}.paper-item:hover{background:#f0f7fb}.paper-item.active{border-color:#a9d1e7;background:#eaf5fb}.item-top{display:flex;align-items:center;gap:7px;color:#246c94;font-size:12px;font-weight:700;margin-bottom:5px}.number{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:6px;background:#dbeef9}.item-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.42;font-weight:650}.item-meta{color:var(--muted);font-size:11px;margin-top:5px}.drawer-foot{border-top:1px solid var(--line);padding:10px 16px;color:var(--muted);font-size:11px}
.workspace{margin-left:328px;height:calc(100vh - 66px);transition:margin-left .23s ease}.workspace iframe{display:block;width:100%;height:100%;border:0;background:#fff}.closed .drawer{transform:translateX(-100%)}.closed .workspace{margin-left:0}.backdrop{display:none}.empty{padding:18px;color:var(--muted);font-size:13px}.mode-hint{display:none}
@media(max-width:900px){.drawer{width:min(86vw,328px);box-shadow:10px 0 30px #102f4b40}.workspace{margin-left:0}.closed .drawer{transform:translateX(-100%)}body:not(.closed) .backdrop{display:block;position:fixed;inset:66px 0 0;background:#0c2e4966;z-index:12}.brand{font-size:15px}.top-title{display:none}.tabs button{padding:7px 9px;font-size:12px}.topbar{gap:8px;padding:0 9px}.menu{flex-shrink:0}.drawer-foot{font-size:10px}}
@media(max-width:520px){.brand{font-size:13px}.tabs{gap:2px}.tabs button{padding:6px 6px;font-size:11px}.import-link{font-size:11px;padding:6px}}
</style></head><body>
<header class="topbar"><button class="menu" id="menu" type="button" aria-label="打开或收起论文列表" aria-expanded="true">☰</button><div class="brand">论文抽取浏览</div><div class="top-title" id="top-title"></div><a class="import-link" href="import.html">＋ 导入论文</a><div class="tabs"><button type="button" data-view="extraction" class="active">抽取字段</button><button type="button" data-view="pdf">英文原文</button><button type="button" data-view="zh">中文译文</button></div></header>
<aside class="drawer" id="drawer"><div class="drawer-head"><strong>论文列表</strong><span>当前论文 + 10 篇代表性样本</span><input id="paper-search" class="drawer-search" type="search" placeholder="搜索标题、领域或 DOI…" aria-label="搜索论文"></div><div class="paper-list" id="paper-list"></div><div class="drawer-foot">选择论文后，右侧内容在当前页面更新。</div></aside><div class="backdrop" id="backdrop"></div>
<main class="workspace"><iframe id="content-frame" title="论文内容"></iframe></main>
<script>
const PAPERS=[{"id":"2906","category":"大气化学","doi":"10.5194/acp-21-10413-2021","title":"Present and future aerosol impacts on Arctic climate change in the GISS-E2.1 Earth system model","extraction":"paper_cases/2906.html","pdf":"acp-21-10413-2021.pdf","zh":"paper_2906_zh.html","datasets":19,"variables":54,"questions":4,"zhTitle":"GISS-E2.1 地球系统模型中气溶胶对北极气候变化的当前和未来影响"},{"id":"23206","category":"冰川与再分析","doi":"10.5194/tc-18-17-2024","title":"Evaluation of reanalysis data and dynamical downscaling for surface energy balance modeling at mountain glaciers in western Canada","extraction":"paper_cases/23206.html","pdf":"paper_pdfs/23206.pdf","zh":"paper_translations/23206.html","datasets":15,"variables":97,"questions":3,"zhTitle":"加拿大西部山地冰川表面能量平衡模拟中再分析资料与动力降尺度的评估"},{"id":"24466","category":"冰川物质平衡","doi":"10.1017/jog.2024.19","title":"Glacier mass balance and its climatic and nonclimatic drivers in the Ladakh region during 2000–2021 from remote sensing data","extraction":"paper_cases/24466.html","pdf":"paper_pdfs/24466.pdf","zh":"paper_translations/24466.html","datasets":17,"variables":27,"questions":4,"zhTitle":"基于遥感数据的 2000–2021 年拉达克地区冰川物质平衡及其气候与非气候驱动因素"},{"id":"27135","category":"高原积雪","doi":"10.4236/acs.2025.153028","title":"Spatiotemporal Characteristics of Snow Cover and Its Climate Impacts in the Western Tibetan Plateau Region","extraction":"paper_cases/27135.html","pdf":"paper_pdfs/27135.pdf","zh":"paper_translations/27135.html","datasets":4,"variables":15,"questions":3,"zhTitle":"青藏高原西部积雪的时空特征及其气候影响"},{"id":"22371","category":"植被遥感","doi":"10.1038/s41597-022-01565-2","title":"Near-real-time MODIS-derived vegetation index data products and online services for CONUS based on NASA LANCE","extraction":"paper_cases/22371.html","pdf":"paper_pdfs/22371.pdf","zh":"paper_translations/22371.html","datasets":11,"variables":17,"questions":3,"zhTitle":"基于 NASA LANCE 的美国本土近实时 MODIS 植被指数数据产品与在线服务"},{"id":"34308","category":"迁徙生态","doi":"10.1016/j.ecoinf.2025.103218","title":"Multi-modal, interrelated navigation in migratory birds: A data mining study","extraction":"paper_cases/34308.html","pdf":"paper_pdfs/34308.pdf","zh":"paper_translations/34308.html","datasets":8,"variables":26,"questions":3,"zhTitle":"迁徙鸟类的多模态关联导航：一项数据挖掘研究"},{"id":"24470","category":"大气化学","doi":"10.1029/2022JD038090","title":"Diverging Ozone Trends Above Western North America: Boundary Layer Decreases Versus Free Tropospheric Increases","extraction":"paper_cases/24470.html","pdf":"paper_pdfs/24470.pdf","zh":"paper_translations/24470.html","datasets":10,"variables":29,"questions":3,"zhTitle":"北美西部上空臭氧趋势分化：边界层下降与自由对流层上升"},{"id":"10020","category":"生态水文","doi":"10.3389/frwa.2021.675284","title":"Association Between Subcatchment Land Cover and Ecological Stoichiometry Along a Human Modified Stream Network","extraction":"paper_cases/10020.html","pdf":"paper_pdfs/10020.pdf","zh":"paper_translations/10020.html","datasets":7,"variables":43,"questions":4,"zhTitle":"受人类改造河网中子流域土地覆盖与生态化学计量关系"},{"id":"3242","category":"干旱监测","doi":"10.5194/hess-22-6611-2018","title":"Developing a drought-monitoring index for the contiguous US using SMAP","extraction":"paper_cases/3242.html","pdf":"paper_pdfs/3242.pdf","zh":"paper_translations/3242.html","datasets":8,"variables":16,"questions":2,"zhTitle":"利用 SMAP 构建美国本土干旱监测指数"},{"id":"31853","category":"冻土与碳循环","doi":"10.5194/esd-14-39-2023","title":"PInc-PanTher estimates of Arctic permafrost soil carbon under the GeoMIP G6solar and G6sulfur experiments","extraction":"paper_cases/31853.html","pdf":"paper_pdfs/31853.pdf","zh":"paper_translations/31853.html","datasets":6,"variables":19,"questions":4,"zhTitle":"GeoMIP G6solar 和 G6sulfur 试验下 PInc-PanTher 对北极多年冻土土壤碳的估算"},{"id":"28116","category":"农业气象","doi":"10.1016/j.agrformet.2023.109635","title":"Comparing forest and grassland drought responses inferred from eddy covariance and Earth observation","extraction":"paper_cases/28116.html","pdf":"paper_pdfs/28116.pdf","zh":"paper_translations/28116.html","datasets":9,"variables":40,"questions":3,"zhTitle":"基于涡度协方差与地球观测推断的森林和草地干旱响应比较"}];
const list=document.getElementById('paper-list'),frame=document.getElementById('content-frame'),title=document.getElementById('top-title');
let selected=0,view='extraction';
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderList(){const term=document.getElementById('paper-search').value.trim().toLowerCase();let shown=0;list.innerHTML=PAPERS.map((p,i)=>{if(term&&!`${p.zhTitle} ${p.title} ${p.category} ${p.doi}`.toLowerCase().includes(term))return '';shown++;return `<button type="button" class="paper-item ${i===selected?'active':''}" data-index="${i}"><span class="item-top"><span class="number">${i+1}</span>${esc(p.category)}</span><span class="item-title">${esc(p.zhTitle)}</span><span class="item-meta" lang="en">${esc(p.title)}</span><span class="item-meta">${esc(p.doi)} · 数据集 ${p.datasets} · 变量 ${p.variables}</span></button>`}).join('');if(!shown)list.innerHTML='<div class="empty">没有匹配的论文</div>'}
function pdfSource(p,page){return location.protocol==='file:'?p.pdf+(page?'#page='+page+'&view=FitH':'#view=FitH'):'paper_pdf_viewer.html?file='+encodeURIComponent(p.pdf)+(page?'#page='+page:'')}
function source(p){return view==='pdf'?pdfSource(p):view==='zh'?p.zh:p.extraction}
function update(){const p=PAPERS[selected];if(view==='pdf'&&!p.pdf||view==='zh'&&!p.zh)view='extraction';title.textContent=p.zhTitle;document.title=`${p.zhTitle} · 论文抽取浏览`;frame.src=source(p);frame.title=`${p.title} · ${view==='pdf'?'英文原文':view==='zh'?'中文译文':'抽取字段'}`;document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.disabled=b.dataset.view==='pdf'&&!p.pdf||b.dataset.view==='zh'&&!p.zh;b.title=b.disabled?'尚未添加'+(b.dataset.view==='pdf'?'英文原文 PDF':'中文译文'):''});document.querySelector('.drawer-head span').textContent=`共 ${PAPERS.length} 篇论文`;renderList();history.replaceState(null,'',`#paper=${p.id}&view=${view}`)}
function choose(i){selected=i;update();if(window.matchMedia('(max-width:900px)').matches)closeDrawer()}
function closeDrawer(){document.body.classList.add('closed');document.getElementById('menu').setAttribute('aria-expanded','false')}
function toggleDrawer(){const closed=document.body.classList.toggle('closed');document.getElementById('menu').setAttribute('aria-expanded',String(!closed))}
list.addEventListener('click',e=>{const b=e.target.closest('button[data-index]');if(b)choose(Number(b.dataset.index))});document.getElementById('paper-search').addEventListener('input',renderList);document.getElementById('menu').addEventListener('click',toggleDrawer);document.getElementById('backdrop').addEventListener('click',closeDrawer);document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;update()}));
const hash=new URLSearchParams(location.hash.slice(1));const match=PAPERS.findIndex(p=>p.id===hash.get('paper'));if(match>=0)selected=match;if(['extraction','pdf','zh'].includes(hash.get('view')))view=hash.get('view');if(window.matchMedia('(max-width:900px)').matches)closeDrawer();update();
window.addEventListener('message',e=>{const x=e.data;if(e.source!==frame.contentWindow||!x||x.kind!=='open-english-page'||x.paperId!==PAPERS[selected].id)return;const page=Number(x.page);if(!Number.isInteger(page)||page<1||page>100)return;view='pdf';update();frame.src=pdfSource(PAPERS[selected],page)});
</script></body></html>
